name: Release

on:
  push:
    tags: ["v*"]

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create tag on release repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          script: |
            const owner = 'sejun3232';
            const repo = 'music-dashboard';
            const tag = context.ref.replace('refs/tags/', '');

            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${repoData.default_branch}` });

            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: ref.object.sha });
              console.log(`Tag ${tag} created`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Tag ${tag} already exists`);
              } else {
                throw e;
              }
            }

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: sejun3232
          repo: music-dashboard
          tagName: v__VERSION__
          releaseName: "Music Dashboard v__VERSION__"
          releaseBody: "자동 업데이트를 통해 업데이트됩니다."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
